name: Deploy Kratos

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, gaia]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: registry.tienzo.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_RAW_PASSWORD }}

      # Registers the MCP bearer token as a Docker secret and exports the
      # generated name (kratos_mcp_token_<hash>) for the deploy step. Content
      # comes from the repo's KRATOS_MCP_TOKEN secret.
      - name: Setup Secrets
        env:
          KRATOS_MCP_TOKEN: ${{ secrets.KRATOS_MCP_TOKEN }}
        run: |
          if [ -z "${KRATOS_MCP_TOKEN}" ]; then
            echo "Error: KRATOS_MCP_TOKEN secret is required" >&2
            exit 1
          fi
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/ensure_secret.sh -o /tmp/ensure_secret.sh
          chmod +x /tmp/ensure_secret.sh
          echo "KRATOS_MCP_TOKEN_NAME=$(echo "$KRATOS_MCP_TOKEN" | /tmp/ensure_secret.sh kratos_mcp_token)" >> $GITHUB_ENV

      - name: Prepare host data directory
        env:
          KRATOS_DB_MOUNT_PATH: ${{ vars.KRATOS_DB_MOUNT_PATH }}
        run: |
          # The database uses a bind mount, so the source path must exist on the
          # node before the stack deploys or Swarm rejects the task with
          # "bind source path does not exist" and the API crash-loops waiting on
          # a database that never starts.
          #
          # The runner is a container that mounts only the Docker socket, so it
          # cannot mkdir a host path itself. The daemon can, though, through a
          # throwaway container with a host bind mount; odin/deploy.yml uses the
          # same technique for /opt/odin/*.
          #
          # Ownership is deliberately NOT set here. The postgres entrypoint runs
          # as root and chowns PGDATA to the postgres user on every start, so a
          # fresh directory is handled for us; re-owning it on a directory that
          # already holds a database breaks the running server with
          # "FATAL: could not open file \"global/pg_filenode.map\": Permission denied".
          DB_DIR="${KRATOS_DB_MOUNT_PATH:-/opt/kratos/data}"
          docker run --rm -v "${DB_DIR}":/data alpine mkdir -p /data

      - name: Validate Required Configuration
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          MUNINN_MASTER_KEY: ${{ secrets.MUNINN_MASTER_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_HEALTH_ID: ${{ vars.DISCORD_CHANNEL_HEALTH_ID }}
          DISCORD_USER_ID: ${{ vars.DISCORD_USER_ID }}
        run: |
          MISSING=""
          [ -z "$DOMAIN_NAME" ] && MISSING="$MISSING DOMAIN_NAME"
          [ -z "$REGISTRY_PREFIX" ] && MISSING="$MISSING REGISTRY_PREFIX"
          [ -z "$MUNINN_MASTER_KEY" ] && MISSING="$MISSING MUNINN_MASTER_KEY"
          [ -z "$DISCORD_BOT_TOKEN" ] && MISSING="$MISSING DISCORD_BOT_TOKEN"
          [ -z "$DISCORD_CHANNEL_HEALTH_ID" ] && MISSING="$MISSING DISCORD_CHANNEL_HEALTH_ID"
          [ -z "$DISCORD_USER_ID" ] && MISSING="$MISSING DISCORD_USER_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Deployment halted: missing required configuration:$MISSING" >&2
            exit 1
          fi

      - name: Build and Deploy with Docker Compose
        env:
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          KRATOS_DB_MOUNT_PATH: ${{ vars.KRATOS_DB_MOUNT_PATH || '/opt/kratos/data' }}
          KRATOS_LLM_BASE_URL: ${{ vars.KRATOS_LLM_BASE_URL || 'http://muninn:4000/v1' }}
          KRATOS_LLM_API_KEY: ${{ secrets.MUNINN_MASTER_KEY }}
          KRATOS_LLM_MODEL: ${{ vars.KRATOS_LLM_MODEL || 'app-synthesize' }}
          KRATOS_EIR_INTERNAL_URL: ${{ vars.KRATOS_EIR_INTERNAL_URL || 'http://eir-api:8000' }}
          KRATOS_DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KRATOS_DISCORD_HEALTH_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_HEALTH_ID }}
          KRATOS_DISCORD_USER_ID: ${{ vars.DISCORD_USER_ID }}
          IMAGE_TAG: kratos
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/deploy.sh -o /tmp/deploy.sh
          chmod +x /tmp/deploy.sh
          /tmp/deploy.sh "kratos" docker-compose.yml
