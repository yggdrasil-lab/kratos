services:
  kratos-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=kratos
      - POSTGRES_DB=kratos
      - POSTGRES_PASSWORD=kratos
      - TZ=Pacific/Auckland
    volumes:
      # Bind mount, not a relative path: Swarm cannot resolve those.
      - ${KRATOS_DB_MOUNT_PATH:-/opt/kratos/data}:/var/lib/postgresql/data
    networks:
      - aether-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - "com.docker.compose.project=${STACK_NAME}"

  kratos-api:
    image: ${REGISTRY_PREFIX}kratos-api:${STACK_NAME:-latest}
    build: ./api
    environment:
      # The database is reachable only on the internal aether-net network and
      # publishes no host port, so the credential is hardcoded rather than
      # plumbed through a Swarm secret. See "The database password" in
      # Areas/90-Infrastructure/Kratos/Kratos Stack.md.
      - KRATOS_DATABASE_URL=postgresql+psycopg://kratos:kratos@kratos-db:5432/kratos
      - KRATOS_ENVIRONMENT=production
      - TZ=Pacific/Auckland
    networks:
      - aether-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - "com.docker.compose.project=${STACK_NAME}"
        - "traefik.enable=true"
        # PathPrefix makes /api more specific than the web catch-all, so the API
        # wins for /api/* and everything else falls through to the client.
        - "traefik.http.routers.kratos-api.rule=Host(`kratos.${DOMAIN_NAME:?DOMAIN_NAME is required}`) && PathPrefix(`/api`)"
        - "traefik.http.routers.kratos-api.entrypoints=websecure"
        - "traefik.http.routers.kratos-api.tls=true"
        - "traefik.http.routers.kratos-api.tls.certresolver=cloudflare"
        - "traefik.http.routers.kratos-api.middlewares=authelia,kratos-api-strip"
        # The client calls /api/*; the service itself serves unprefixed routes.
        - "traefik.http.middlewares.kratos-api-strip.stripprefix.prefixes=/api"
        - "traefik.http.services.kratos-api.loadbalancer.server.port=8000"
        - "traefik.docker.network=aether-net"

  kratos-web:
    image: ${REGISTRY_PREFIX}kratos-web:${STACK_NAME:-latest}
    build: ./web
    environment:
      - TZ=Pacific/Auckland
    networks:
      - aether-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - "com.docker.compose.project=${STACK_NAME}"
        - "traefik.enable=true"
        - "traefik.http.routers.kratos-web.rule=Host(`kratos.${DOMAIN_NAME:?DOMAIN_NAME is required}`)"
        - "traefik.http.routers.kratos-web.entrypoints=websecure"
        - "traefik.http.routers.kratos-web.tls=true"
        - "traefik.http.routers.kratos-web.tls.certresolver=cloudflare"
        - "traefik.http.routers.kratos-web.middlewares=authelia"
        - "traefik.http.services.kratos-web.loadbalancer.server.port=8080"
        - "traefik.docker.network=aether-net"

networks:
  aether-net:
    external: true
