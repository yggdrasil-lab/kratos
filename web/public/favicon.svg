<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Solid background: essential for iOS Safari apple-touch-icon without black corner artifacts -->
  <rect width="512" height="512" fill="#0f172a" />
  <rect x="24" y="24" width="464" height="464" rx="96" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.3" />
  
  <!-- Stylized Barbell / Power Emblem -->
  <!-- Main Bar -->
  <line x1="96" y1="256" x2="416" y2="256" stroke="url(#kratosBlue)" stroke-width="32" stroke-linecap="round" />
  
  <!-- Outer Heavy Plates -->
  <rect x="144" y="144" width="36" height="224" rx="18" fill="url(#kratosBlue)" />
  <rect x="332" y="144" width="36" height="224" rx="18" fill="url(#kratosBlue)" />
  
  <!-- Inner Mid Plates -->
  <rect x="196" y="176" width="28" height="160" rx="14" fill="url(#kratosCyan)" />
  <rect x="288" y="176" width="28" height="160" rx="14" fill="url(#kratosCyan)" />
  
  <!-- Center Knurling Indicator / Power Core -->
  <circle cx="256" cy="256" r="22" fill="#60a5fa" />
  
  <defs>
    <linearGradient id="kratosBlue" x1="96" y1="144" x2="416" y2="368" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" />
      <stop offset="0.5" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="kratosCyan" x1="196" y1="176" x2="316" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
</svg>